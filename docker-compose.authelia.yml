version: "3.8"

services:
  # =============================================================================
  # PostgreSQL Database Service
  # =============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: brand-craftsman-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: brand_craftsman
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brand_craftsman"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================================
  # Authelia Authentication & SSO Service
  # =============================================================================
  authelia:
    image: authelia/authelia:latest
    container_name: brand-craftsman-authelia
    restart: unless-stopped
    ports:
      - "9091:9091"
    volumes:
      - ./authelia/configuration.yml:/config/configuration.yml:ro
      - ./authelia/users_database.yml:/config/users_database.yml:ro
    environment:
      - TZ=Asia/Kolkata
      - AUTHELIA_STORAGE_POSTGRES_PASSWORD=postgres_password
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
