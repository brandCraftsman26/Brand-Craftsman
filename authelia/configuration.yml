# =============================================================================
# Authelia Configuration for Brand Craftsman
# Single Sign-On (SSO) & Multi-Factor Authentication (MFA)
# =============================================================================

server:
  host: 0.0.0.0
  port: 9091

log:
  level: info

telemetry:
  metrics:
    enabled: false

theme: dark

jwt_secret: "brand-craftsman-authelia-jwt-secret-key-at-least-32-characters-long"

default_redirection_url: "http://localhost:3000"

# Authentication backend (File-based local users for development & initial setup)
authentication_backend:
  password_reset:
    disable: true
  file:
    path: /config/users_database.yml
    watch: true

# Access Control rules
access_control:
  default_policy: one_factor
  rules:
    - domain: "localhost"
      policy: one_factor
    - domain: "*.brandcraftsman.in"
      policy: two_factor

# Session configuration
session:
  name: authelia_session
  same_site: lax
  secret: "brand-craftsman-authelia-session-secret-must-be-very-secure-32chars"
  expiration: 1h
  inactivity: 15m
  domain: localhost

# Multi-Factor Authentication
regulation:
  max_retries: 5
  find_time: 2m
  ban_time: 5m

storage:
  postgres:
    host: postgres
    port: 5432
    database: brand_craftsman
    username: postgres
    password: postgres_password
    schema: public
    timeout: 5s

notifier:
  filesystem:
    filename: /config/notification.txt

# OpenID Connect 1.0 Provider for NextAuth / Auth.js
